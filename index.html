<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flur-Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Farben & Grundlagen ---------- */
  :root{
    --bg:#16130f;          /* warmes Anthrazit, passt zu Altbau/Holz */
    --panel:#201c17;
    --line:#332d25;
    --text:#f1ebe1;
    --muted:#a59b8c;
    --faint:#6f665a;
    --accent:#d9a65a;      /* Ocker */
    --ok:#8fb38a;
    --warn:#e0895a;
    --u1:#3c7233; --u2:#c3022d; --u3:#ec6726; --u4:#00a984; --u5:#bc7a00; --u6:#0065ae;
    --tram:#e30613; --bus:#00586a; --sbahn:#408335;
    --r:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text)}
  body{
    font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    height:100vh;height:100dvh;
    max-width:900px;margin:0 auto;
    padding:44px 40px 28px;
    display:grid;
    grid-template-rows:auto auto 1fr auto auto;
    gap:22px;
  }

  /* ---------- Kopf: Uhr & Datum ---------- */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .clock{
    font-family:"Fraunces",Georgia,serif;font-weight:300;
    font-size:132px;line-height:.86;letter-spacing:-4px;
    font-variant-numeric:tabular-nums;
  }
  .clock .sep{opacity:.55}
  .date{text-align:right;padding-bottom:8px}
  .date .dow{font-size:30px;font-weight:500}
  .date .dm{font-size:22px;color:var(--muted);margin-top:4px}

  /* ---------- Karten ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px}
  .label{
    font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center
  }
  .label .hint{letter-spacing:.04em;text-transform:none;font-weight:500}

  /* ---------- Wetter ---------- */
  .weather{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
  .now{display:flex;align-items:center;gap:16px}
  .now svg{width:76px;height:76px}
  .temp{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:78px;line-height:1;letter-spacing:-2px}
  .nowtxt{font-size:19px;color:var(--muted);margin-top:4px}
  .hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
  .hours div{font-size:16px;color:var(--muted)}
  .hours b{display:block;font-size:21px;color:var(--text);font-weight:500;margin-top:4px}
  .hours svg{width:30px;height:30px;margin:6px auto 0;display:block}
  .hours .rain{font-size:13px;color:#7fa7c9;margin-top:2px;min-height:16px}
  .advice{
    grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;
    font-size:19px;color:var(--text);display:flex;gap:10px;align-items:center
  }
  .advice .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}

  /* ---------- Abfahrten ---------- */
  .deps{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  #deps{overflow:hidden}
  .stopname{font-size:17px;color:var(--muted);margin:14px 0 6px;font-weight:500}
  .stopname:first-of-type{margin-top:0}
  .dep{
    display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:16px;
    padding:9px 0;border-bottom:1px solid var(--line)
  }
  .dep:last-child{border-bottom:none}
  .line{
    font-weight:600;font-size:20px;color:#fff;text-align:center;
    border-radius:8px;padding:5px 0;
  }
  .line.tram,.line.bus{border-radius:20px}
  .line.sev{border-radius:20px;border:2px solid var(--u3);color:var(--text);padding:3px 0}
  .dest{font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dest small{display:block;font-size:14px;color:var(--warn);margin-top:2px}
  .min{font-family:"Fraunces",Georgia,serif;font-size:34px;font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
  .min span{font-family:"Instrument Sans",sans-serif;font-size:16px;color:var(--muted);margin-left:3px}
  .min.go{color:var(--accent)}
  .min.gone{color:var(--faint)}
  .empty{color:var(--muted);font-size:18px;padding:12px 0}

  /* ---------- Musik ---------- */
  .music{display:grid;grid-template-columns:96px 1fr auto;gap:20px;align-items:center}
  .cover{width:96px;height:96px;border-radius:12px;background:linear-gradient(135deg,#3b3227,#5a4630);display:grid;place-items:center}
  .cover svg{width:42px;height:42px;opacity:.6}
  .track{font-size:22px;font-weight:500}
  .artist{font-size:18px;color:var(--muted);margin-top:3px}
  .rooms{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .room{font-size:14px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .room.on{border-color:var(--accent);color:var(--accent)}
  .ctrl{display:flex;gap:10px}
  .btn{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--text)}
  .btn.main{background:var(--text);color:var(--bg);border:none}
  .btn svg{width:24px;height:24px}

  /* ---------- Fuß ---------- */
  .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--faint)}
  .badge{color:var(--accent)}

  /* ---------- Nachtmodus ---------- */
  .night{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s}
  body.is-night .night{opacity:.55}

  /* Querformat-Fallback */
  @media (orientation:landscape){
    .wrap{max-width:none;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto auto;column-gap:26px}
    .head{grid-column:1/-1}
    .weather-card{grid-column:1}
    .deps-card{grid-column:2;grid-row:2/4}
    .music-card{grid-column:1}
    .foot{grid-column:1/-1}
    .clock{font-size:104px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="clock" id="clock">--<span class="sep">:</span>--</div>
    <div class="date"><div class="dow" id="dow">–</div><div class="dm" id="dm">–</div></div>
  </header>

  <section class="card weather-card">
    <div class="label">Wetter · Sendling <span class="hint" id="wxSrc"></span></div>
    <div class="weather" id="weather"><div class="empty">Lade Wetter …</div></div>
  </section>

  <section class="card deps-card deps">
    <div class="label">Abfahrten <span class="hint" id="depSrc"></span></div>
    <div id="deps"><div class="empty">Lade Abfahrten …</div></div>
  </section>

  <section class="card music-card">
    <div class="label">Musik <span class="hint">Vorschau · Steuerung folgt mit Home Assistant</span></div>
    <div class="music">
      <div class="cover"><svg viewBox="0 0 24 24" fill="none" stroke="#f1ebe1" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg></div>
      <div>
        <div class="track">Wohnzimmer · WiiM</div>
        <div class="artist">Gerade nichts verbunden</div>
        <div class="rooms"><span class="room on">Wohnzimmer</span><span class="room">Küche</span><span class="room">Bad</span></div>
      </div>
      <div class="ctrl">
        <button class="btn" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="btn main" aria-label="Wiedergabe"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span id="status">–</span>
    <span>Flur-Cockpit</span>
  </footer>
</div>
<div class="night"></div>

<script>
/* =========================================================
   EINSTELLUNGEN – hier anpassen
   ========================================================= */
const CONFIG = {
  lat: 48.1185, lon: 11.5420,               // Sendling (Wetter)
  stops: [                                   // id = MVG globalId
    { name: "Implerstraße",     id: "de:09162:1140", walk: 7 },   // walk = Gehminuten
    { name: "Brudermühlstraße", id: "de:09162:1430", walk: 9 }
  ],
  perStop: 3,                                // Abfahrten pro Haltestelle
  nightFrom: 22, nightTo: 6,                 // Display abdunkeln
  refreshDeps: 60,                           // Sekunden
  refreshWx: 900
};

/* ---------- Hilfen ---------- */
const $ = id => document.getElementById(id);
// Beispieldaten nur in der Vorschau – auf dem iPad (github.io) nie, damit keine falschen Abfahrten an der Wand stehen
const PREVIEW = !/github\.io$/.test(location.hostname);
const pad = n => String(n).padStart(2,"0");
const DOW = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

async function getJSON(url, ms=8000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}

/* ---------- Uhr & Nacht ---------- */
function tick(){
  const d = new Date();
  $("clock").innerHTML = pad(d.getHours()) + '<span class="sep">:</span>' + pad(d.getMinutes());
  $("dow").textContent = DOW[d.getDay()];
  $("dm").textContent = d.getDate() + ". " + MON[d.getMonth()];
  const h = d.getHours();
  const night = CONFIG.nightFrom > CONFIG.nightTo ? (h >= CONFIG.nightFrom || h < CONFIG.nightTo) : (h >= CONFIG.nightFrom && h < CONFIG.nightTo);
  document.body.classList.toggle("is-night", night);
}

/* ---------- Wetter-Icons ---------- */
const I = {
  sun:'<svg viewBox="0 0 48 48" fill="none" stroke="#e8b45a" stroke-width="2.4" stroke-linecap="round"><circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></svg>',
  part:'<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="18" cy="17" r="6" stroke="#e8b45a"/><path d="M18 5v3M6 17h3M9.5 8.5l2 2M26.5 8.5l-2 2" stroke="#e8b45a"/><path d="M16 38h20a7 7 0 0 0 0-14 10 10 0 0 0-19 3 5.5 5.5 0 0 0-1 11z" stroke="#cfc6b8" fill="#201c17"/></svg>',
  cloud:'<svg viewBox="0 0 48 48" fill="none" stroke="#cfc6b8" stroke-width="2.4" stroke-linecap="round"><path d="M14 36h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z"/></svg>',
  fog:'<svg viewBox="0 0 48 48" fill="none" stroke="#a59b8c" stroke-width="2.4" stroke-linecap="round"><path d="M8 18h32M12 25h28M8 32h26M14 39h20"/></svg>',
  rain:'<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M14 30h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" stroke="#cfc6b8"/><path d="M17 36l-2 5M25 36l-2 5M33 36l-2 5" stroke="#7fa7c9"/></svg>',
  snow:'<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M14 30h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" stroke="#cfc6b8"/><path d="M17 38h0M24 41h0M31 38h0" stroke="#e6eef5" stroke-width="4"/></svg>',
  storm:'<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" stroke="#cfc6b8"/><path d="M25 32l-4 6h6l-4 6" stroke="#e8b45a"/></svg>'
};
function wmo(c){
  if(c===0) return ["sun","klar"];
  if(c<=2) return ["part","teils bewölkt"];
  if(c===3) return ["cloud","bedeckt"];
  if(c===45||c===48) return ["fog","Nebel"];
  if(c>=51&&c<=67) return ["rain", c<60?"Niesel":"Regen"];
  if(c>=71&&c<=77) return ["snow","Schnee"];
  if(c>=80&&c<=82) return ["rain","Schauer"];
  if(c>=85&&c<=86) return ["snow","Schneeschauer"];
  if(c>=95) return ["storm","Gewitter"];
  return ["cloud","–"];
}

function adviceFor(cur, hours){
  const maxRain = Math.max(...hours.map(h=>h.p));
  const minT = Math.min(cur.t, ...hours.map(h=>h.t));
  const bits = [];
  if(maxRain >= 50) bits.push("Schirm mitnehmen");
  else if(maxRain >= 25) bits.push("Schirm einpacken schadet nicht");
  if(minT <= 0) bits.push("Mütze & Handschuhe");
  else if(minT <= 6) bits.push("Warme Jacke");
  else if(minT >= 22) bits.push("Leicht anziehen");
  return bits.length ? bits.join(" · ") : "Nichts Besonderes – einfach los";
}

function renderWeather(w, demo){
  const [ic, txt] = wmo(w.code);
  const hrs = w.hours.map(h=>`<div>${h.h} Uhr${I[wmo(h.code)[0]]}<b>${Math.round(h.t)}°</b><div class="rain">${h.p>=20?h.p+" %":""}</div></div>`).join("");
  $("weather").innerHTML = `
    <div>
      <div class="now">${I[ic]}<div class="temp">${Math.round(w.t)}°</div></div>
      <div class="nowtxt">${txt} · gefühlt ${Math.round(w.feel)}° · ${Math.round(w.min)}° / ${Math.round(w.max)}°</div>
    </div>
    <div class="hours">${hrs}</div>
    <div class="advice"><span class="dot"></span>${adviceFor(w, w.hours)}</div>`;
  $("wxSrc").innerHTML = demo ? '<span class="badge">Vorschau-Daten</span>' : "Open-Meteo";
}

async function loadWeather(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`+
      `&current=temperature_2m,apparent_temperature,weather_code&hourly=temperature_2m,precipitation_probability,weather_code`+
      `&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FBerlin&forecast_days=2`;
    const d = await getJSON(u);
    const now = new Date(); const startIdx = d.hourly.time.findIndex(t=>new Date(t) > now);
    const hours = [];
    for(let i=startIdx; i<startIdx+12 && i<d.hourly.time.length; i+=2){
      hours.push({h: pad(new Date(d.hourly.time[i]).getHours()), t:d.hourly.temperature_2m[i], p:d.hourly.precipitation_probability[i]||0, code:d.hourly.weather_code[i]});
    }
    renderWeather({t:d.current.temperature_2m, feel:d.current.apparent_temperature, code:d.current.weather_code,
                   min:d.daily.temperature_2m_min[0], max:d.daily.temperature_2m_max[0], hours}, false);
  }catch(e){
    if(!PREVIEW){ $("weather").innerHTML = '<div class="empty">Wetter gerade nicht erreichbar – neuer Versuch in Kürze</div>'; $("wxSrc").textContent=""; setTimeout(loadWeather, 60000); return; }
    const h = new Date().getHours();
    const demo = [0,2,4,6,8,10].map((o,i)=>({h:pad((h+1+o)%24), t:[7,8,8,6,5,4][i], p:[10,30,60,40,10,0][i], code:[2,3,61,61,3,2][i]}));
    renderWeather({t:6.5, feel:3.8, code:3, min:3, max:9, hours:demo}, true);
  }
}

/* ---------- Abfahrten (MVG-Schnittstelle, Echtzeit) ---------- */
const MVG = "https://www.mvg.de/api/bgw-pt/v3";
function lineClass(label, type, sev){
  const n = (label||"").replace(/\s/g,"");
  if(sev || (type==="BUS" && /^U\d/.test(n))) return {cls:"sev", color:"transparent", label:n};
  if(type==="UBAHN") return {cls:"", color:`var(--${n.toLowerCase()}, var(--u3))`, label:n};
  if(type==="SBAHN") return {cls:"", color:"var(--sbahn)", label:n};
  if(type==="TRAM") return {cls:"tram", color:"var(--tram)", label:n};
  return {cls:"bus", color:"var(--bus)", label:n};
}
function renderDeps(groups, demo){
  const now = Date.now();
  $("deps").innerHTML = groups.map(g=>{
    const rows = g.items.length ? g.items.map(x=>{
      const m = Math.round((x.when - now)/60000);
      const tight = m < g.walk;               // schafft man nicht mehr zu Fuß
      const go = m >= g.walk && m <= g.walk+2; // jetzt los
      const lc = lineClass(x.line, x.type, x.sev);
      return `<div class="dep">
        <div class="line ${lc.cls}" style="background:${lc.color}">${lc.label}</div>
        <div class="dest">${x.dir}${lc.cls==="sev"?`<small>Ersatzverkehr (Bus)</small>`:""}${x.delay>=2?`<small>+${x.delay} Min. Verspätung</small>`:""}${x.cancelled?`<small>fällt aus</small>`:""}</div>
        <div class="min ${tight?"gone":go?"go":""}">${m<=0?"jetzt":m}<span>${m<=0?"":"Min"}</span></div>
      </div>`;
    }).join("") : `<div class="empty">Keine Abfahrten gefunden</div>`;
    return `<div class="stopname">${g.name} · ${g.walk} Min. zu Fuß</div>${rows}`;
  }).join("");
  $("depSrc").innerHTML = demo ? '<span class="badge">Vorschau-Daten</span>' : "orange = jetzt los";
}
async function loadDeps(){
  try{
    const groups = [];
    for(const st of CONFIG.stops){
      const r = await getJSON(`${MVG}/departures?globalId=${st.id}&limit=${CONFIG.perStop*5}`);
      const list = r.map(d=>({line:d.label, type:d.transportType, sev:!!d.sev, dir:d.destination,
                  when:d.realtimeDepartureTime||d.plannedDepartureTime, delay:d.delayInMinutes||0, cancelled:!!d.cancelled}))
        .filter(d=>d.when - Date.now() >= st.walk*60000)   // nur, was zu Fuß noch erreichbar ist
        .sort((x,y)=>x.when-y.when).slice(0, CONFIG.perStop);
      groups.push({name:st.name, walk:st.walk, items:list});
    }
    renderDeps(groups, false);
    setStatus(true);
  }catch(e){
    if(!PREVIEW){ $("deps").innerHTML = '<div class="empty">Abfahrten gerade nicht erreichbar</div>'; $("depSrc").textContent=""; setStatus(false); return; }
    const t = Date.now(), m = x => t + x*60000;
    renderDeps([
      {name:"Implerstraße", walk:7, items:[
        {line:"U3", type:"UBAHN", dir:"Moosach", when:m(5)}, {line:"U6", type:"UBAHN", dir:"Garching-Forschungszentrum", when:m(8)},
        {line:"U3", type:"UBAHN", dir:"Fürstenried West", when:m(11), delay:2}, ]},
      {name:"Brudermühlstraße", walk:9, items:[
        {line:"U3", type:"BUS", sev:true, dir:"Goetheplatz", when:m(10)}, {line:"54", type:"BUS", dir:"Lorettoplatz", when:m(13)},
        {line:"U3", type:"UBAHN", dir:"Fürstenried West", when:m(16)}]}
    ], true);
    setStatus(false);
  }
}
function setStatus(live){
  const d = new Date();
  $("status").textContent = (live ? "Aktualisiert " : (PREVIEW ? "Offline-Vorschau · " : "Keine Verbindung · ")) + pad(d.getHours())+":"+pad(d.getMinutes());
}

/* ---------- Selbst-Update: lädt neu, sobald eine neue Fassung im Repo liegt ---------- */
const VERSION = "3";
async function checkUpdate(){
  if(PREVIEW) return;
  try{ const v = await getJSON("version.json?t="+Date.now()); if(v.v && v.v !== VERSION) location.reload(); }catch(e){}
}
setInterval(checkUpdate, 5*60*1000);

/* ---------- Start ---------- */
tick(); setInterval(tick, 1000);
loadWeather(); setInterval(loadWeather, CONFIG.refreshWx*1000);
loadDeps(); setInterval(loadDeps, CONFIG.refreshDeps*1000);
// Seite einmal pro Nacht neu laden (gegen Speicherlecks im Dauerbetrieb)
setTimeout(()=>location.reload(), (()=>{const n=new Date(),r=new Date(n);r.setHours(4,0,0,0);if(r<=n)r.setDate(r.getDate()+1);return r-n;})());
</script>
</body>
</html>
